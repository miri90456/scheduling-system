spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduling_db
    username: scheduling
    password: scheduling
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          scheduler:
            instanceName: SchedulingSystem
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            useProperties: "true"
            isClustered: false
          threadPool:
            threadCount: 10

server:
  port: 8080

logging:
  level:
    com.scheduling: DEBUG
    org.quartz: INFO
