spring:
  datasource:
    url: jdbc:h2:mem:scheduling_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  quartz:
    job-store-type: memory
    properties:
      org:
        quartz:
          scheduler:
            instanceName: SchedulingSystem
            instanceId: AUTO
          threadPool:
            threadCount: 10

server:
  port: 8080

logging:
  level:
    com.scheduling: DEBUG
    org.quartz: INFO
